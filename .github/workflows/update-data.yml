name: Update data
on:
  schedule:
    - cron: "0 4 * * *"   # раз в сутки, ~07:00 МСК
  workflow_dispatch: {}    # кнопка ручного запуска в Actions
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-data.mjs
      - name: Sync public copy
        run: cp data/data.json public/data/data.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/data.json public/data/data.json
          git diff --staged --quiet || git commit -m "chore: update data.json"
          git push
