<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VPN Finder — в какой стране работают покер-румы через VPN</title>
    <meta
      name="description"
      content="Выберите свои покер-румы — покажем страны для VPN, где работают все сразу. Статусы PokerStars, GGpoker/ПокерОК, Покердом, 888poker и ещё 25 румов по 96 странам."
    />

    <meta name="theme-color" content="#0C0E12" />
    <meta name="color-scheme" content="dark light" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="VPN Finder — какую страну ставить в VPN для покера" />
    <meta property="og:description" content="Отметьте свои румы — покажем страны, где работают все сразу." />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Тема до первого рендера: сохранённая → системная → тёмная. Без «мигания» белым. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
          if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#F4F5F8");
        } catch (e) {}
      })();
    </script>
    <style>
      /* критичный фон до загрузки CSS */
      html { background: #0c0e12; }
      html[data-theme="light"] { background: #f4f5f8; }
    </style>
  </head>
  <body>
    <noscript>Для работы VPN Finder включите JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
